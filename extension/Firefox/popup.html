<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Scr33nX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 240px;
      background: #0a0a0b;
      color: #f2f2f4;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
    }

    .header {
      background: #101011;
      padding: 9px 14px;
      border-bottom: 2px solid #ff2b3d;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .header .dot  { color: #ff2b3d; font-size: 15px; line-height: 1; }
    .header .title { font-weight: 700; font-size: 12px; letter-spacing: 1px; color: #f2f2f4; }

    .body { padding: 13px 14px 14px; }

    .model-name {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .site-label {
      font-size: 10px;
      color: #56565c;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 11px;
    }

    .status-badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 3px;
      background: #17171a;
      margin-bottom: 11px;
    }
    .status-badge.recording { color: #ff2b3d; }
    .status-badge.online    { color: #3ecf8e; }
    .status-badge.offline   { color: #56565c; }
    .status-badge.checking  { color: #ffc14d; }

    .rank-row {
      display: flex;
      gap: 4px;
      margin-bottom: 11px;
      user-select: none;
    }
    .rank-row .star {
      font-size: 19px;
      line-height: 1;
      color: #3a3a3e;
      cursor: pointer;
      transition: color 0.1s, transform 0.1s;
    }
    .rank-row .star.on { color: #ffc14d; }
    .rank-row .star:hover { transform: scale(1.18); }
    .rank-row.disabled .star { cursor: default; opacity: 0.38; }
    .rank-row.disabled .star:hover { transform: none; }

    .btn {
      display: block;
      width: 100%;
      padding: 7px 10px;
      margin-bottom: 6px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      transition: opacity 0.12s;
    }
    .btn:last-of-type { margin-bottom: 0; }
    .btn:hover:not(:disabled) { opacity: 0.82; }
    .btn:disabled { opacity: 0.38; cursor: default; }
    .btn-rec   { background: #3ecf8e; color: #0a0a0b; }
    .btn-saved { background: #ff2b3d; color: #0a0a0b; }
    .btn-start { background: #3ecf8e; color: #0a0a0b; }
    .btn-stop  { background: #ff2b3d; color: #fff; }
    .btn-ghost { background: #17171a; color: #8a8a90; cursor: default; }
    .btn-remove {
      background: transparent;
      color: #56565c;
      border: 1px solid #272729;
      font-size: 11px;
      padding: 5px 10px;
      margin-top: 2px;
    }
    .btn-remove:hover:not(:disabled) {
      color: #ff2b3d;
      border-color: #ff2b3d;
      opacity: 1;
    }

    .auto-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 2px;
      margin-bottom: 6px;
      font-size: 12px;
      color: #8a8a90;
      cursor: pointer;
      user-select: none;
    }
    .auto-row:hover { color: #f2f2f4; }
    .auto-row input { accent-color: #ff2b3d; cursor: pointer; }
    .auto-row input:disabled { cursor: default; }

    .msg {
      text-align: center;
      padding: 18px 0 14px;
      color: #56565c;
      font-size: 12px;
      line-height: 1.6;
    }
    .msg .icon { font-size: 26px; display: block; margin-bottom: 6px; }

    .feedback {
      font-size: 11px;
      text-align: center;
      padding: 5px 8px;
      border-radius: 3px;
      margin-top: 7px;
    }
    .feedback.ok  { background: #10241a; color: #3ecf8e; }
    .feedback.err { background: #2a0c0f; color: #ff2b3d; }

    /* linked identities (aka) */
    .banner-warn {
      font-size: 11px;
      background: #2a1c07;
      color: #ffa726;
      border-radius: 3px;
      padding: 5px 8px;
      margin-bottom: 9px;
      text-align: center;
    }
    /* inline "record anyway?" confirm (replaces the Start button) */
    .confirm-txt {
      font-size: 11px;
      background: #2a1c07;
      color: #ffa726;
      border-radius: 3px;
      padding: 6px 8px;
      margin-bottom: 7px;
      line-height: 1.5;
      text-align: center;
    }
    .confirm-txt b { color: #f2f2f4; }
    .btn-cancel { background: #17171a; color: #8a8a90; }
    .aka-row {
      font-size: 11px;
      color: #8a8a90;
      line-height: 1.6;
      margin: -4px 0 9px;
    }
    .aka-row b { color: #f2f2f4; font-weight: 600; }
    .aka-st { text-transform: uppercase; font-size: 9px; letter-spacing: .5px; }
    .aka-st.recording { color: #ff2b3d; }
    .aka-st.online    { color: #3ecf8e; }
    .aka-st.offline, .aka-st.none { color: #56565c; }
    .aka-st.checking  { color: #ffc14d; }

    /* add-on options (highlight filter + mini player) */
    .opts { border-top: 1px solid #1d1d20; padding: 10px 14px 12px; }
    .opt-title {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 10px; color: #56565c; text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 7px;
    }
    .opt-title button {
      background: none; border: none; color: #56565c; font: inherit;
      cursor: pointer; text-transform: none; letter-spacing: 0;
    }
    .opt-title button:hover { color: #ff2b3d; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip {
      font-size: 11px; padding: 3px 7px; border-radius: 3px; cursor: pointer;
      background: #17171a; color: #8a8a90; user-select: none;
      border: 1px solid #272729;
    }
    .chip input { display: none; }
    .chip:hover { color: #f2f2f4; }
    .chip.on { background: #2a0c0f; color: #f2f2f4; border-color: #ff2b3d; }
    .chip .st { color: #ffc14d; }
    details.mp { margin-top: 10px; }
    details.mp summary {
      font-size: 11px; color: #8a8a90; cursor: pointer; user-select: none;
    }
    details.mp summary:hover { color: #f2f2f4; }
    details.mp .auto-row { margin: 4px 0 0; padding: 4px 2px; }
    .opt-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; color: #8a8a90; padding: 4px 2px;
    }
    .opt-row select {
      background: #17171a; color: #f2f2f4; border: 1px solid #272729;
      border-radius: 3px; font: inherit; font-size: 11px; padding: 2px 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img class="dot" src="icons/devil32.png" width="18" height="18" alt="">

    <span class="title">Scr33nX</span>
  </div>
  <div class="body" id="root">
    <div class="msg"><span class="icon">⏳</span>Loading…</div>
  </div>
  <div class="opts">
    <div class="opt-title">Highlight thumbnails <button id="hlClear">clear</button></div>
    <div class="chips" id="hl">
      <label class="chip"><input type="checkbox" value="recording">● REC</label>
      <label class="chip"><input type="checkbox" value="online">Online</label>
      <label class="chip"><input type="checkbox" value="r5"><span class="st">★</span>5</label>
      <label class="chip"><input type="checkbox" value="r4"><span class="st">★</span>4</label>
      <label class="chip"><input type="checkbox" value="r3"><span class="st">★</span>3</label>
      <label class="chip"><input type="checkbox" value="r2"><span class="st">★</span>2</label>
      <label class="chip"><input type="checkbox" value="r1"><span class="st">★</span>1</label>
      <label class="chip"><input type="checkbox" value="r0">No rank</label>
    </div>
    <details class="mp">
      <summary>⚙ Mini player</summary>
      <label class="auto-row"><input type="checkbox" id="mpEnabled"> Show on hover</label>
      <label class="auto-row" title="Also models not in your Recorder — slower to start, and every preview is one extra lookup on the cam site"><input type="checkbox" id="mpAny"> Preview any model</label>
      <div class="opt-row">Size
        <select id="mpWidth">
          <option value="280">Small</option>
          <option value="360">Medium</option>
          <option value="480">Large</option>
          <option value="640">X-Large</option>
        </select>
      </div>
      <div class="opt-row">Hover delay
        <select id="mpDelay">
          <option value="500">0.5 s</option>
          <option value="1000">1 s</option>
          <option value="1500">1.5 s</option>
          <option value="2000">2 s</option>
          <option value="3000">3 s</option>
        </select>
      </div>
      <div class="opt-row">Quality
        <select id="mpQuality">
          <option value="360">360p</option>
          <option value="480">480p</option>
          <option value="720">720p</option>
          <option value="0">Max</option>
        </select>
      </div>
      <label class="auto-row"><input type="checkbox" id="mpMuted"> Start muted</label>
    </details>
  </div>
  <script src="popup.js"></script>
</body>
</html>
